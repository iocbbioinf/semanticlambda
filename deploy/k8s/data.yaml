# The stores. Both are StatefulSets with a PVC: they hold the only thing in
# this system that must survive a restart — the saved queries and their
# interactions. (The app itself holds nothing durable; see app.yaml.)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: semanticlambda-mongo
  labels: { app: semanticlambda-mongo }
spec:
  serviceName: semanticlambda-mongo
  replicas: 1
  selector:
    matchLabels: { app: semanticlambda-mongo }
  template:
    metadata:
      labels: { app: semanticlambda-mongo }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: mongo
          image: docker.io/mongo:7.0
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: semanticlambda-mongo
spec:
  clusterIP: None            # headless: the StatefulSet's stable identity
  selector: { app: semanticlambda-mongo }
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
# Qdrant holds entity vectors. It is REBUILDABLE — every entity is also in
# Mongo — so losing this volume costs a reindex, not data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: semanticlambda-qdrant
  labels: { app: semanticlambda-qdrant }
spec:
  serviceName: semanticlambda-qdrant
  replicas: 1
  selector:
    matchLabels: { app: semanticlambda-qdrant }
  template:
    metadata:
      labels: { app: semanticlambda-qdrant }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: qdrant
          image: docker.io/qdrant/qdrant:v1.15.1
          env:
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          ports:
            - name: http
              containerPort: 6333
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: semanticlambda-qdrant
spec:
  selector: { app: semanticlambda-qdrant }
  ports:
    - name: http
      port: 6333
      targetPort: http
